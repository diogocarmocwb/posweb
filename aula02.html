<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuário</title>
</head>
<body>
  <h1>Cadastro de Usuário</h1>
  <form>
    <fieldset><legend>Dados Pessoais</legend>
    <div>
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required />
    </div>

    <div>
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required />
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
    </div>
    </fieldset>
    <br>
  <fieldset>
    <legend>Dados Complementares</legend>
    <div>
      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 9 0000-0000" required />
    </div>

    <div>
      <label for="data-nascimento">Data de Nascimento:</label>
      <input type="date" id="data-nascimento" name="data-nascimento" required />
    </div>

    <div>
      <label for="score-financeiro">Score Financeiro:</label>
      <input type="number" id="score-financeiro" name="score-financeiro" min="0" max="1000" required />
    </div>

    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required />
    </div>
  </form>
</fieldset>
<br> 
 
    <button type="submit">Cadastrar</button>
  </form>

</body>
</html>
