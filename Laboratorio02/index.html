<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Cadastro UTFPR Tech Week</title>
  </head>
  <body>
    <header>
      <h1>Cadastro UTFPR Tech Week</h1>
    </header>
    <main>
      <section>
        <h2>Formulário de Cadastro</h2>
        <p>
          Preencha o formulário abaixo para se cadastrar na UTFPR Tech Week.
        </p>
      </section>
      <form>
        <fieldset>
          <legend>Dados Pessoais</legend>
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" required />
          <br /><br />
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
          <br /><br />
          <label for="nascimento">Data de Nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" required />
          <br /><br />
          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            pattern="\(\d{2}\) \d{5}-\d{4}"
            placeholder="(99) 99999-9999"
            title="Digite um número de telefone válido no formato (99) 99999-9999"
            required
          />
        </fieldset>
        <fieldset>
          <legend>Preferências do evento</legend>
          <label for="convidados">Quantidade de Convidados:</label>
          <input
            type="number"
            id="convidados"
            name="convidados"
            min="0"
            max="5"
            required
          />
          <br /><br />
          <label for="portfolio">URL do Portfólio:</label>
          <input
            type="url"
            id="portfolio"
            name="portfolio"
            placeholder="https://seuportfólio.com"
          />
          <br /><br />
          <label for="senha">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            minlength="8"
            required
          />
          <br /><br />
          <label for="curso">Curso:</label>
          <input type="text" id="curso" name="curso" required />
          <br /><br />
          <label for="experiencia">Nível de Experiência:</label>
          <input
            type="range"
            id="experiencia"
            name="experiencia"
            min="0"
            max="10"
          />
        </fieldset>
        <br />
        <input type="submit" value="Cadastrar" />
      </form>
    </main>
    <footer>
      <p>&copy; 2023 UTFPR Tech Week . Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
