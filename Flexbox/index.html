<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout com Menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1 class="logo">MeuSite</h1>

        <nav class="menu">
          <a href="#">Início</a>
          <a href="#">Sobre</a>
          <a href="#">Serviços</a>
          <a href="#">Contato</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="conteudo">
        <h2>Conteúdo Principal</h2>
        <p>Este é o conteúdo principal da página.</p>
      </section>

      <aside class="sidebar">
        <h3>Barra Lateral</h3>
        <p>Links ou informações extras.</p>
      </aside>
    </main>

    <footer>
      <p>© 2026 - Meu Site</p>
    </footer>
  </body>
</html>
