<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Grid com Áreas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <header>
        <h1>Header</h1>
      </header>
      <aside>
        <h2>Aside</h2>
        <p>Menu lateral ou painel de navegação.</p>
      </aside>
      <section>
        <h2>Section</h2>
        <p>Conteúdo principal da página com texto, imagens ou cards.</p>
      </section>
      <footer>
        <p>Footer: informações de rodapé.</p>
      </footer>
    </div>
  </body>
</html>
